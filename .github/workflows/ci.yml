# Smoke test first (the whole tool on sample Epic responses), then the unit
# tests. Offline: no Epic credentials or Claude key are needed (ADR-014).
# Tests marked `live` (real Epic endpoints) and `launch` (a human at a
# browser) don't run here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Smoke test
        run: pytest -m smoke -v
      - name: Unit tests
        run: pytest -m "not smoke and not live and not launch"
