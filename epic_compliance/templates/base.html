<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Epic Readiness{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Epic&nbsp;<span>Readiness</span></a>
    <nav>
      <a href="/" class="{{ 'active' if active == 'assess' }}">New assessment</a>
      <a href="/runs" class="{{ 'active' if active == 'history' }}">Assessments</a>
      <a href="/config" class="{{ 'active' if active == 'config' }}">Settings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
