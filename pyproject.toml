[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epic-compliance"
version = "0.1.0"
description = "Epic FHIR ONC (g)(10) compliance verification tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.28.0",
    "rich>=13.7.0",
    "cryptography>=42.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
epic-compliance = "epic_compliance.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["epic_compliance*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits real Epic sandbox endpoints over the network (no credentials needed)",
    "launch: full interactive SMART launch; needs EPIC_SANDBOX_CLIENT_ID + --launch-interactive",
]
